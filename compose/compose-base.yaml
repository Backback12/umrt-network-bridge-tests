name: bridge_base_stack

x-ros-environment: &ros_environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"

x-ros-container: &ros_container
  image: "${BRIDGE_BASE_IMAGE:-ghcr.io/umroboticsteam/umrt-build:comms-base-station}"

services:
  bridge_base:
    <<: *ros_container
    container_name: bridge_base
    stdin_open: true
    tty: true
    init: true
    cap_add:
      - NET_ADMIN
    command:
      - bash
      - -lc
      - exec /workspace/bridge_test/scripts/run_zenoh_stack.sh base
    ports:
      - "${FOXGLOVE_HOST_BIND:-0.0.0.0}:8765:8765/tcp"
    environment:
      <<: *ros_environment
      BRIDGE_WORKSPACE: "/workspace/bridge_test"
    volumes:
      - "${REPO_DIR:-..}:/workspace/bridge_test"
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.57
      bridge_hi:
        ipv4_address: 10.0.20.57
      foxglove_local: {}

networks:
  foxglove_local:
    driver: bridge
  bridge_lo:
    external: true
  bridge_hi:
    external: true
