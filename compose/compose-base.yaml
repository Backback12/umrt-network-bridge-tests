services:
  bridge_base:
    image: bridge_test:v1
    container_name: bridge_base
    stdin_open: true
    tty: true
    ports:
      - "8765:8765"  # Expose default Foxglove UI Port
#    environment:
#      ROS_DOMAIN_ID: "1"
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.57
      bridge_hi:
        ipv4_address: 10.0.20.57

networks:
  bridge_lo:
    external: true
  bridge_hi:
    external: true
