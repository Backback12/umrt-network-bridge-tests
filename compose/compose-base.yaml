name: bridge_base_stack

x-ros-environment: &ros_environment
  ROS_DOMAIN_ID: "0"
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
  ROUTE_POLICY: "drop-default"

x-ros-container: &ros_container
  image: "ghcr.io/umroboticsteam/umrt-build:main:v1"

services:
  bridge_base:
    <<: *ros_container
    container_name: bridge_base
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    ports:
      - "8765:8765"  # Expose default Foxglove UI Port
    environment:
      <<: *ros_environment
    volumes:
      - ./config/base-hi.yaml:/opt/ros/humble/share/network_bridge/config/base-hi.yaml:ro
      - ./config/base-lo.yaml:/opt/ros/humble/share/network_bridge/config/base-lo.yaml:ro
      - ./config/base.launch.py:/opt/ros/humble/share/network_bridge/launch/base.launch.py:ro
    command:
      - bash
      - -lc
      - source /opt/ros/humble/setup.bash && ros2 launch network_bridge base.launch.py
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.57
      bridge_hi:
        ipv4_address: 10.0.20.57

networks:
  bridge_lo:
    external: true
  bridge_hi:
    external: true
