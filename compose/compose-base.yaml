name: bridge_base_stack

x-ros-environment: &ros_environment
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
  ROS_LOCALHOST_ONLY: "0"
  RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
  ROUTE_POLICY: "drop-default"

x-ros-container: &ros_container
  image: "${BRIDGE_TEST_IMAGE:-bridge_test:v1}"
  entrypoint: ["/usr/local/bin/network_policy.sh"]
  cap_add:
    - NET_ADMIN

services:
  bridge_base:
    <<: *ros_container
    container_name: bridge_base
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      <<: *ros_environment
      FASTDDS_DEFAULT_PROFILES_FILE: "/dds-configs/fastdds-base.xml"
      FASTRTPS_DEFAULT_PROFILES_FILE: "/dds-configs/fastdds-base.xml"
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.57
      bridge_hi:
        ipv4_address: 10.0.20.57

  foxglove_bridge:
    <<: *ros_container
    container_name: foxglove_bridge
    restart: unless-stopped
    command:
      - bash
      - -lc
      - source /opt/ros/humble/setup.bash && exec ros2 launch foxglove_bridge foxglove_bridge_launch.xml address:=0.0.0.0 port:=8765
    environment:
      <<: *ros_environment
      FASTDDS_DEFAULT_PROFILES_FILE: "/dds-configs/fastdds-foxglove.xml"
      FASTRTPS_DEFAULT_PROFILES_FILE: "/dds-configs/fastdds-foxglove.xml"
    ports:
      - "${FOXGLOVE_HOST_BIND:-0.0.0.0}:8765:8765"
    networks:
      bridge_lo:
        ipv4_address: 10.0.10.49
      bridge_hi:
        ipv4_address: 10.0.20.49
      foxglove_local: {}

networks:
  foxglove_local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  bridge_lo:
    external: true
  bridge_hi:
    external: true
