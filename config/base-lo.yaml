# UMRT
# Base Station Low
# FROM BASE STATION TO ROVER LOW

/**/*:
  ros__parameters:
    network_interface: "network_bridge::UdpInterface"

    UdpInterface:
      local_address: "10.0.10.57"
      receive_port: 5157  # lo base port
      remote_address: "10.0.10.59"
      send_port: 5159     # lo rover port
  
  
    default_rate: 100.0
    default_zstd_level: 3
    publish_stale_data: False

    topics:
      - "/cmd_velocity"
    
